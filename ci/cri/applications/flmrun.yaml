metadata:
  name: flmrun
spec:
  shim: cri
  image: localhost:5000/xflops/flmrt:ci
  description: The Flame App application for executing customized Python applications.
  command: /usr/local/flame/bin/uv
  arguments:
    - run
    - --python
    - /usr/bin/python3
    - python
    - -m
    - flamepy.app.runpy
  environments:
    FLAME_HOME: /usr/local/flame
    FLAME_PYTHON_VERSION: "3.12"
    PYTHONPATH: /usr/local/flame/lib/python3.12/site-packages
  installer: python
  schema: {}
