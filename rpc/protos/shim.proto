syntax = "proto3";

import "types.proto";

package flame.v1;

option go_package = "github.com/flame-sh/flame/sdk/go/rpc/v1";

message ApplicationContext {
    string name = 1;
    Shim shim = 2;  // Required shim type for the application
    optional string image = 3;
    optional string command = 4;
    optional string working_directory = 5;
    optional string url = 6;
    optional string installer = 7;
    string workspace = 8;
}

message SessionContext {
    string session = 1;
    ApplicationContext application = 2;
    optional bytes common_data = 3;
    map<string, string> tokens = 4;
    string workspace = 5;
}

message TaskContext {
    string task = 1;
    string session = 2;
    optional bytes input = 4;
    string workspace = 5;
}

message OnSessionEnterResponse {
    Result result = 1;
    optional ExecutorAttributes attributes = 2;
}

message OnTaskInvokeResponse {
    TaskResult task_result = 1;
    optional ExecutorAttributes attributes = 2;
}

service Instance {
    rpc OnSessionEnter(SessionContext) returns (OnSessionEnterResponse) {}
    rpc OnTaskInvoke(TaskContext) returns (OnTaskInvokeResponse) {}
    rpc OnSessionLeave(EmptyRequest) returns (Result) {}
}
