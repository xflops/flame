syntax = "proto3";

import "types.proto";

package flame.v1;

option go_package = "github.com/flame-sh/flame/sdk/go/rpc/v1";

/*
 * The frontend service of Flame, which is used to communicate with client sdk,
 * e.g. create connection/session/task and so on.
 */
service Frontend {
  rpc RegisterApplication(RegisterApplicationRequest) returns (Result) {}
  rpc UnregisterApplication(UnregisterApplicationRequest) returns (Result) {}
  rpc UpdateApplication(UpdateApplicationRequest) returns (Result) {}

  rpc GetApplication(GetApplicationRequest) returns (Application) {}
  rpc ListApplications(ListApplicationsRequest) returns (ApplicationList) {}

  rpc ListExecutors(ListExecutorsRequest) returns (ExecutorList) {}

  // Node operations
  rpc ListNodes(ListNodesRequest) returns (NodeList) {}
  rpc GetNode(GetNodeRequest) returns (GetNodeResponse) {}
  rpc DeleteNode(DeleteNodeRequest) returns (Result) {}

  rpc CreateSession (CreateSessionRequest) returns (Session) {}
  rpc DeleteSession (DeleteSessionRequest) returns (Session) {}

  rpc OpenSession (OpenSessionRequest) returns (Session) {}
  rpc CloseSession (CloseSessionRequest) returns (Session) {}
  rpc SuspendSession (SuspendSessionRequest) returns (Session) {}
  rpc ResumeSession (ResumeSessionRequest) returns (Session) {}

  rpc GetSession(GetSessionRequest) returns (Session) {}
  rpc ListSessions (ListSessionsRequest) returns (SessionList) {}

  rpc CreateTask (CreateTaskRequest) returns (Task) {}

  rpc GetTask (GetTaskRequest) returns (Task) {}
  rpc WatchTasks (stream WatchTaskRequest) returns (stream Task) {}
  // Paged calls return encoded PageInfo in initial metadata "flame-page-bin".
  // This includes empty pages; no synthetic Task is added to the stream.
  rpc ListTasks (ListTasksRequest) returns (stream Task) {}
}

message RegisterApplicationRequest {
  string name = 1;
  ApplicationSpec application = 2;
}

message UnregisterApplicationRequest {
  string name = 1;
}

message UpdateApplicationRequest {
  string name = 1;
  ApplicationSpec application = 2;
}

message GetApplicationRequest {
  string name = 1;
}

message ListApplicationsRequest {
  optional ApplicationState state = 1;
  PageRequest paging = 2;
  repeated string names = 3;
}

message ListExecutorsRequest {
  PageRequest paging = 1;
  optional ExecutorState state = 2;
  optional string application = 3;
  optional string node = 4;
  optional string session_id = 5;
  repeated string ids = 6;
}

// ListNodesRequest lists registered nodes, optionally in bounded pages.
message ListNodesRequest {
  PageRequest paging = 1;
  optional NodeState state = 2;
  repeated string names = 3;
}

// GetNodeRequest is the request for getting a specific node by name.
message GetNodeRequest {
  string name = 1;
}

// DeleteNodeRequest removes a registered node that is not ready and owns no executors.
message DeleteNodeRequest {
  string name = 1;
}

// GetNodeResponse is the response containing the requested node.
message GetNodeResponse {
  Node node = 1;
}

message CreateSessionRequest {
  string session_id = 1;
  SessionSpec session = 2;
}

message DeleteSessionRequest {
  string session_id = 1;
}

message OpenSessionRequest {
  string session_id = 1;
  optional SessionSpec session = 2;
}

message CloseSessionRequest {
  string session_id = 1;
}

message SuspendSessionRequest {
  string session_id = 1;
}

message ResumeSessionRequest {
  string session_id = 1;
}

message GetSessionRequest {
  string session_id = 1;
}

message ListSessionsRequest {
  optional string application = 1;
  optional SessionState state = 2;
  // Only these sessions; an empty list means no filter on ids.
  repeated string ids = 3;
  PageRequest paging = 4;
}

message CreateTaskRequest {
  TaskSpec task = 1;
}

message GetTaskRequest {
  string task_id = 1;
  string session_id = 2;
}

message WatchTaskRequest {
  string task_id = 1;
  string session_id = 2;
}

message ListTasksRequest {
  string session_id = 1;
  PageRequest paging = 2;
  optional TaskState state = 3;
  repeated int64 ids = 4;
  // Paged calls omit input/output/affinity by default. Legacy calls are unchanged.
  bool include_payloads = 5;
}
