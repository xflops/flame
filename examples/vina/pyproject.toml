[project]
name = "vina-dock"
version = "0.1.0"
description = "CPU virtual screening with AutoDock Vina on Flame"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "vina==1.2.7",
]

[project.optional-dependencies]
prepare = [
    "rdkit==2025.9.3",
    "meeko==0.6.1",
    "numpy==2.2.6",
    "scipy==1.15.3",
    "gemmi==0.7.3",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["engine", "main", "report", "prepare"]
