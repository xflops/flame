[project]
name = "replay-buffer"
version = "0.2.0"
description = "Distributed Replay Buffer Example using Flame's patch_object API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.4",
    "gymnasium>=1.4.0",
]

[dependency-groups]
dev = ["flamepy"]

[tool.setuptools]
py-modules = ["main", "replay_buffer", "collector", "distributed"]
