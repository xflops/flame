[project]
name = "rl"
version = "0.2.0"
description = "Distributed Reinforcement Learning Example using Flame App"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.15.0",
    "numpy>=2.5.4",
    "gymnasium[mujoco]>=1.4.0",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.11.2"]

[dependency-groups]
dev = ["flamepy"]

[tool.setuptools]
py-modules = ["distributed", "main", "model"]
