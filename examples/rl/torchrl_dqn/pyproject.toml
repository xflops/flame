[project]
name = "torchrl-dqn"
version = "0.2.0"
description = "TorchRL DQN Example using Flame App and patch_object replay buffer"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "gymnasium>=1.4.0",
    "tensordict>=0.15.6",
    "torch>=2.15.0",
    "torchrl>=0.15.0",
]

[project.optional-dependencies]
box2d = ["gymnasium[box2d]>=1.4.0"]

[dependency-groups]
dev = ["flamepy"]

[tool.setuptools]
py-modules = ["main", "model", "collector", "replay_buffer", "distributed"]
