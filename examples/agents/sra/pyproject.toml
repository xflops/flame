[project]
name = "sra"
version = "0.2.0"
description = "Simple Research Agent by Flame"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "flamepy",
  "ddgs>=9.16.1",
  "langchain>=1.5.0",
  "langgraph>=1.2.21",
  "langchain-deepseek>=1.1.1",
  "langchain-community>=0.4.2",
  "qdrant-client>=1.20.0",
  "requests>=2.34.2",
  "markitdown>=0.1.9",
  "python-dotenv>=1.2.4",
  "pytest>=9.2.0",
]

[tool.uv.sources]
flamepy = { path = "/usr/local/flame/sdk/python" }
