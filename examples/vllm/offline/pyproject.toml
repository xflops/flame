[project]
name = "flame-vllm"
version = "0.2.0"
description = "Retained vLLM engine and prefix-cache reuse with flamepy.app"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
	"vllm==0.33.0",
]

[build-system]
requires = ["setuptools>=84.2.1", "wheel>=0.48.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main", "engine"]
