[project]
name = "flame-vllm-serving"
version = "0.1.0"
description = "Batched vLLM inference through flamepy.serving"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["vllm==0.31.0"]

[project.scripts]
vllm-serving = "service:ins.run"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["service", "client"]
