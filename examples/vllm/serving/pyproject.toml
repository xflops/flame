[project]
name = "flame-vllm-serving"
version = "0.1.0"
description = "Batched vLLM inference through flamepy.serving"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["vllm==0.33.0"]

[project.scripts]
vllm-serving = "service:ins.run"

[build-system]
requires = ["setuptools>=84.2.1", "wheel>=0.48.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["service", "client"]
