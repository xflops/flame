[package]
name = "candle-based-example"
version = "0.2.0"
edition = "2021"

[dependencies]
flame-rs = { path = "../../../sdk/rust", features = ["macros"] }

tokio = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_derive = { workspace = true }
serde_json = { workspace = true }
clap = { workspace = true }

candle = { package = "candle-core", version = "0.11.0" }
candle-nn = "0.11.0"
candle-transformers = "0.11.0"
hf-hub = { version = "1.0.0", features = ["blocking"] }
tokenizers = { version = "0.23.2", default-features = false, features = ["onig"] }

[[bin]]
name = "candle-based-example-service"
path = "src/service.rs"

[[bin]]
name = "candle-based-example"
path = "src/client.rs"
