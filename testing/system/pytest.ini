[pytest]
timeout = 300
timeout_method = thread
timeout_func_only = true
log_cli = true
log_cli_level = INFO
markers =
    stress: opt-in system stress tests; enable with FLAME_E2E_SYSTEM_TESTS=stress or all
    longevity: opt-in sustained-runtime system tests; enable with FLAME_E2E_SYSTEM_TESTS=longevity or all
    app: opt-in system App tests; enable with FLAME_E2E_SYSTEM_TESTS=app or all
