[project]
name = "e2e"
version = "0.1.0"
description = "The e2e test of Flame"
readme = "README.md"
authors = [
    { name = "XFLOPS Authors", email = "support@xflops.io" }
]
requires-python = ">=3.11"
dependencies = [
    "cloudpickle>=3.1.2",
    "grpcio>=1.85.0",
    "grpcio-tools>=1.85.0",
]

[project.scripts]
e2e = "e2e:main"
flamepy-app-e2e = "e2e.app:main"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["e2e*"]
exclude = ["tests*"]

[dependency-groups]
dev = [
    "flamepy",
    "pytest>=9.2.0",
    "pytest-timeout>=2.4.0",
    "black>=26.10.1",
    "isort>=9.0.2",
]

[tool.pytest.ini_options]
timeout = 300
timeout_method = "thread"
timeout_func_only = true
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s [%(levelname)s] %(name)s: %(message)s"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"
markers = [
    "stress: opt-in system stress tests; enable with FLAME_E2E_SYSTEM_TESTS=stress or all",
    "longevity: opt-in sustained-runtime system tests; enable with FLAME_E2E_SYSTEM_TESTS=longevity or all",
    "app: opt-in system App tests; enable with FLAME_E2E_SYSTEM_TESTS=app or all",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.2.0",
  "pytest-asyncio>=1.4.1",
  "ruff>=0.17.3",
]

[tool.ruff]
line-length = 320
target-version = "py38"
exclude = [
    ".eggs",
    ".git",
    ".hg",
    ".tox",
    ".venv",
    "build",
    "dist",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["e2e"]
