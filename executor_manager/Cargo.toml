[package]
name = "flame-executor-manager"
version = "0.7.0"
edition = "2021"

[features]
default = []
wasm = ["dep:wasmtime", "dep:wasmtime-wasi"]

[dependencies]
rpc = { path = "../rpc" }
common = { path = "../common" }
stdng = { path = "../stdng" }
cri-rs = { path = "../cri" }

tokio = { workspace = true }
tonic = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
async-trait = { workspace = true }
clap = { workspace = true }
prost = { workspace = true }
tower = { workspace = true }
hyper-util = { workspace = true }
chrono = { workspace = true }
nix = { workspace = true }
url = { workspace = true }
actix-rt = { workspace = true }
futures = { workspace = true }
uuid = { workspace = true }
rustix = { version = "1.1", features = ["system"] }
num_cpus = "1.17"
serde = { workspace = true }
serde_json = { workspace = true }
serde_derive = { workspace = true }
sha2 = "0.11"
toml = "1.1"

bytes = { workspace = true }
flate2 = "1"
zstd = "0.14"
tar = "0.4"
zip = "9"
reqwest = { version = "0.13", features = ["rustls", "stream"], default-features = false }
futures-util = "0.3"
wasmtime = { version = "50", optional = true }
wasmtime-wasi = { version = "50", optional = true }
anyhow = "1"
tokio-stream = { workspace = true }
shellexpand = "3.1"
nvml-wrapper = "0.13"
notify = "8"

[lints.rust]
unused = "allow"
unsafe_code = "forbid"

[dev-dependencies]
tempfile = "3"
