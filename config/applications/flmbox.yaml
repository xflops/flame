metadata:
  name: flmbox
spec:
  shim: host
  description: The Flame Sandbox application, which runs commands and code in gVisor sandboxes.
  command: ${FLAME_HOME}/bin/flmbox-service
  schema:
    input: >-
      {"$schema":"http://json-schema.org/draft-07/schema#","oneOf":[{"type":"object","properties":{"kind":{"const":"run"},"cmd":{"type":"string","description":"The shell command line to run, e.g. echo hello"},"cwd":{"type":"string","description":"The working directory inside the sandbox"},"envs":{"type":"object","additionalProperties":{"type":"string"},"description":"Extra environment variables"},"timeout":{"type":"number","description":"Timeout in seconds"}},"required":["kind","cmd"]},{"type":"object","properties":{"kind":{"const":"run_code"},"code":{"type":"string","description":"The source code to run"},"language":{"type":"string","description":"The language of the code, e.g. python or shell"},"input":{"type":"array","items":{"type":"integer"},"description":"Standard input in bytes, e.g. [0x1, 0x2]"},"timeout":{"type":"number","description":"Timeout in seconds"}},"required":["kind","code","language"]}]}
    output: >-
      {"$schema":"http://json-schema.org/draft-07/schema#","type":"object","properties":{"exit_code":{"type":"integer","description":"The exit code of the process"},"stdout":{"type":"array","items":{"type":"integer"},"description":"Captured standard output in bytes"},"stderr":{"type":"array","items":{"type":"integer"},"description":"Captured standard error in bytes"}},"required":["exit_code","stdout","stderr"]}
