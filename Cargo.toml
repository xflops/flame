[workspace]
resolver = "2"
members = [
    "common",
    "flmctl",
    "flmping",
    "flmbench",
    "flmexec",
    "flmbox",
    "session_manager",
    "executor_manager",
    "rpc",
    "sdk/rust",
    "sdk/rust/macros",
    "examples/pi/rust",
    "examples/candle/based",
    "cri",
    "stdng",
    "object_cache",
]
[workspace.dependencies]
tokio = { version = "1.54.1", features = ["full"] }
tonic = { version = "0.14.9", features = ["tls-ring", "tls-native-roots"] }
tonic-build = "0.14.9"
tonic-prost = "0.14.9"
tonic-prost-build = "0.14.9"
prost = "0.14.6"
serde = "1.0.229"
serde_json = "1.0.154"
serde_derive = "1.0.229"
bytes = "1.12.1"
tower = "0.5.3"
hyper-util = "0.1.21"
chrono = { version = "0.4.45", features = ["serde"] }
futures = "0.3.34"
nix = { version = "0.31.3", features = ["signal"] }
uuid = { version = "1.29.2", features = ["v4", "serde"] }

tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "local-time"] }
tracing-appender = "0.2.5"

strum = { version = "0.28.0", features = ["derive"] }
strum_macros = "0.28.0"
async-trait = "0.1.92"
clap = { version = "4.6.7", features = ["derive"] }
clap_complete = "4.6.11"
rand = { version = "0.10.3" }

sqlx = { version = "0.9.0", features = [ "runtime-tokio", "tls-native-tls", "sqlite", "postgres", "macros" ] }

url = { version = "2.5.8", features = ["serde"] }

postcard = { version = "1.1.3", features = ["use-std"] }
bson = "3.1.0"

# Shared dependencies moved from sub-projects
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["macros"] }
serde_yaml = "0.9.34"
humantime = "2.4.0"
tokio-stream = "0.1.19"
tempfile = "3.27.0"
comfy-table = "8.0.1"
jsonschema = "0.61.2"
gethostname = "1.1.0"
proc-macro2 = "1.0.107"
proc-macro-crate = "3.5.0"
quote = "1.0.47"
syn = { version = "3.0.10", features = ["full"] }

# Arrow ecosystem (v58 for tonic 0.14 compatibility)

# profiling and HTTP
axum = "0.8.9"
pprof = { version = "0.15.0", features = ["flamegraph", "prost-codec"] }

# parallelism
