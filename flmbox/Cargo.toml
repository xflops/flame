[package]
name = "flmbox"
version = "0.7.0-rc2"
edition = "2021"
description = "flmbox: run commands and code in isolated sandboxes, from the command line or as a Flame service"
readme = "README.md"

[lints.rust]
unsafe_code = "forbid"

[dependencies]
flame-rs = { path = "../sdk/rust", features = ["macros"] }

async-trait = { workspace = true }
tokio = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_derive = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
serde_yaml = { workspace = true }

sha2 = "0.10"
tar = "0.4"
flate2 = "1"
zstd = "0.13"
oci-spec = { version = "0.10", default-features = false, features = ["runtime"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
oci-client = { version = "0.18", default-features = false, features = ["rustls-tls-no-provider"] }
nix = { version = "0.30", default-features = false, features = ["fs"] }
