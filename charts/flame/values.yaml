global:
  imageRegistry: xflops
  imageTag: latest
  imagePullPolicy: IfNotPresent
  imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

cluster:
  name: flame
  # Optional session-manager bind IP or interface regex; empty binds all IPv4 interfaces.
  advertise: ""
  resreq: "cpu=1,mem=2g"
  policies:
    - drf
    - das
  scheduleInterval: 100
  storage: "fs:///var/lib/flame/session"
  executors:
    # Shims the executor manager runs; Kubernetes executor managers run the host shim.
    shims: [host]
    # Optional device managers loaded by FEM; CPU and memory are always loaded.
    devices: [gpu]
  limits:
    # Maximum number of sessions in the cluster.
    maxSessions: 1000
    application:
      # Optional hard ceiling per application, including idle executors.
      maxExecutors: null
    session:
      # Optional hard ceiling per session, including binding executors.
      maxExecutors: null
    node:
      # Maximum active executors per node, including idle executors.
      maxExecutors: 128
  recovery:
    session:
      retryLimits: 5

sessionManager:
  enabled: true
  image:
    repository: flame-session-manager
    tag: ""
  replicas: 1
  service:
    type: ClusterIP
    frontendPort: 8080
    backendPort: 8081
  persistence:
    enabled: true
    storageClassName: ""
    size: 10Gi
    accessModes:
      - ReadWriteOnce
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  extraEnv: []
  extraVolumes: []
  extraVolumeMounts: []

objectCache:
  image:
    repository: flame-object-cache
    tag: ""
  service:
    type: ClusterIP
    # Bound on each worker node's host network.
    port: 9090
  storage: "/var/lib/flame/cache"
  pool:
    # Byte budget for ready resident part payloads; "0" disables caching.
    size: "256M"
    # Supported replacement policy: lru.
    policy: "lru"
  persistence:
    enabled: true
    # Node directory mounted at `storage`. Data stays on the worker across pod restarts.
    hostPath: /var/lib/flame/cache
  # Used when persistence is disabled. Set medium to "Memory" for a RAM-backed
  # filesystem; stored objects then count against the pod's memory.
  emptyDir:
    medium: ""
    sizeLimit: ""
  # Soft limit of open files for the cache process (`ulimit -n`); 0 keeps the
  # runtime's default. GET readers share one data-file descriptor per active
  # request; allow additional headroom for writes and metadata operations.
  openFiles: 0
  gc:
    interval: 60s
  resources: {}
  extraEnv: []
  extraVolumes: []
  extraVolumeMounts: []

executorManager:
  image:
    repository: flame-executor-manager
    tag: ""
  hostNetwork: true
  hostPID: true
  terminationGracePeriodSeconds: 300
  securityContext:
    privileged: true
    runAsNonRoot: false
    runAsUser: 0
    runAsGroup: 0
  runtimeStorage:
    medium: ""
    sizeLimit: ""
  resources: {}
  nodeSelector:
    kubernetes.io/os: linux
  tolerations: []
  affinity: {}
  extraEnv: []
  extraVolumes: []
  extraVolumeMounts: []

tls:
  enabled: false
  mountPath: /etc/flame/certs
  cluster:
    secretName: ""
    certKey: tls.crt
    privateKeyKey: tls.key
    caKey: ca.crt
  cache:
    secretName: ""
    certKey: tls.crt
    privateKeyKey: tls.key
    caKey: ca.crt

serviceAccount:
  create: true
  name: ""
  automountToken: false

podSecurityContext: {}
securityContext: {}

clientConfig:
  enabled: true

tests:
  enabled: true
  image:
    repository: flame-console
    tag: ""
  resources: {}
