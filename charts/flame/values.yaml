global:
  imageRegistry: xflops
  imageTag: latest
  imagePullPolicy: IfNotPresent
  imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

cluster:
  name: flame
  resreq: "cpu=1,mem=2g"
  policies:
    - drf
    - das
  scheduleInterval: 100
  storage: "fs:///var/lib/flame/session"
  executors:
    shim: host
    # Optional device managers loaded by FEM; CPU and memory are always loaded.
    devices: [gpu]
  limits:
    # Maximum number of sessions in the cluster.
    maxSessions: 1000
    application:
      # Optional hard ceiling per application, including idle executors.
      maxExecutors: null
    session:
      # Optional hard ceiling per session, including binding executors.
      maxExecutors: null
    node:
      # Maximum active executors per node, including idle executors.
      maxExecutors: 128
  recovery:
    session:
      retryLimits: 5

sessionManager:
  enabled: true
  image:
    repository: flame-session-manager
    tag: ""
  replicas: 1
  service:
    type: ClusterIP
    frontendPort: 8080
    backendPort: 8081
  persistence:
    enabled: true
    storageClassName: ""
    size: 10Gi
    accessModes:
      - ReadWriteOnce
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  extraEnv: []
  extraVolumes: []
  extraVolumeMounts: []

objectCache:
  enabled: true
  image:
    repository: flame-object-cache
    tag: ""
  replicas: 1
  service:
    type: ClusterIP
    port: 9090
  storage: "/var/lib/flame/cache"
  persistence:
    enabled: true
    storageClassName: ""
    size: 100Gi
    accessModes:
      - ReadWriteOnce
  # Used when persistence is disabled. Set medium to "Memory" to keep cached
  # objects in RAM; they count against the pod's memory.
  emptyDir:
    medium: ""
    sizeLimit: ""
  eviction:
    policy: lru
    maxMemory: 1G
    maxObjects: null
  # Soft limit of open files for the cache process (`ulimit -n`); 0 keeps the
  # runtime's default. The cache keeps two files open per object it serves, so
  # a busy cache needs far more than the common default of 1024.
  openFiles: 0
  gc:
    interval: 60s
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  extraEnv: []
  extraVolumes: []
  extraVolumeMounts: []

executorManager:
  image:
    repository: flame-executor-manager
    tag: ""
  hostNetwork: true
  hostPID: true
  terminationGracePeriodSeconds: 300
  securityContext:
    privileged: true
    runAsNonRoot: false
    runAsUser: 0
    runAsGroup: 0
  runtimeStorage:
    medium: ""
    sizeLimit: ""
  resources: {}
  nodeSelector:
    kubernetes.io/os: linux
  tolerations: []
  affinity: {}
  extraEnv: []
  extraVolumes: []
  extraVolumeMounts: []

tls:
  enabled: false
  mountPath: /etc/flame/certs
  cluster:
    secretName: ""
    certKey: tls.crt
    privateKeyKey: tls.key
    caKey: ca.crt
  cache:
    secretName: ""
    certKey: tls.crt
    privateKeyKey: tls.key
    caKey: ca.crt

serviceAccount:
  create: true
  name: ""
  automountToken: false

podSecurityContext: {}
securityContext: {}

clientConfig:
  enabled: true

tests:
  enabled: true
  image:
    repository: flame-console
    tag: ""
  resources: {}
