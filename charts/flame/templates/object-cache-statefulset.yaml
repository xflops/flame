{{- if .Values.objectCache.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "flame.objectCache.name" . }}
  labels:
    {{- include "flame.labels" . | nindent 4 }}
    app.kubernetes.io/component: object-cache
spec:
  serviceName: {{ include "flame.objectCache.headlessName" . }}
  replicas: {{ .Values.objectCache.replicas }}
  selector:
    matchLabels:
      {{- include "flame.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: object-cache
  template:
    metadata:
      labels:
        {{- include "flame.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: object-cache
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "flame.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountToken }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: object-cache
          image: {{ include "flame.image" (dict "root" . "image" .Values.objectCache.image) | quote }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          workingDir: /usr/local/flame
          {{- if .Values.objectCache.openFiles }}
          # Runtimes often start a container with a soft limit of 1024 open
          # files; the cache keeps two files open per object it serves.
          command:
            - /bin/sh
            - -c
            - ulimit -n {{ int .Values.objectCache.openFiles }} && exec /usr/local/flame/bin/flame-object-cache "$@"
            - flame-object-cache
          {{- else }}
          command:
            - /usr/local/flame/bin/flame-object-cache
          {{- end }}
          args:
            - --config
            - /usr/local/flame/conf/flame-cluster.yaml
          env:
            - name: RUST_LOG
              value: info
            - name: FLAME_HOME
              value: /usr/local/flame
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            # The configuration is shared by all replicas, so the per-pod
            # address placed in object references comes from the environment.
            - name: FLAME_CACHE_ADVERTISE
              value: {{ printf "%s://$(POD_NAME).%s.$(POD_NAMESPACE).svc:%d" (include "flame.cacheScheme" .) (include "flame.objectCache.headlessName" .) (int .Values.objectCache.service.port) | quote }}
            {{- with .Values.objectCache.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: grpc
              containerPort: {{ .Values.objectCache.service.port }}
              protocol: TCP
          startupProbe:
            tcpSocket:
              port: grpc
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            tcpSocket:
              port: grpc
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: grpc
            periodSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /usr/local/flame/conf/flame-cluster.yaml
              subPath: flame-cluster.yaml
              readOnly: true
            - name: cache-data
              mountPath: /var/lib/flame/cache
            - name: logs
              mountPath: /usr/local/flame/logs
            {{- if .Values.tls.enabled }}
            - name: cluster-tls
              mountPath: {{ include "flame.tlsClusterPath" . }}
              readOnly: true
            - name: cache-tls
              mountPath: {{ include "flame.tlsCachePath" . }}
              readOnly: true
            {{- end }}
            {{- with .Values.objectCache.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.objectCache.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "flame.configMapName" . }}
        - name: logs
          emptyDir: {}
        {{- if not .Values.objectCache.persistence.enabled }}
        - name: cache-data
          emptyDir:
            {{- with .Values.objectCache.emptyDir.medium }}
            medium: {{ . | quote }}
            {{- end }}
            {{- with .Values.objectCache.emptyDir.sizeLimit }}
            sizeLimit: {{ . | quote }}
            {{- end }}
        {{- end }}
        {{- if .Values.tls.enabled }}
        - name: cluster-tls
          secret:
            secretName: {{ .Values.tls.cluster.secretName }}
        - name: cache-tls
          secret:
            secretName: {{ .Values.tls.cache.secretName }}
        {{- end }}
        {{- with .Values.objectCache.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.objectCache.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.objectCache.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.objectCache.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  {{- if .Values.objectCache.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: cache-data
        labels:
          {{- include "flame.labels" . | nindent 10 }}
          app.kubernetes.io/component: object-cache
      spec:
        accessModes:
          {{- toYaml .Values.objectCache.persistence.accessModes | nindent 10 }}
        resources:
          requests:
            storage: {{ .Values.objectCache.persistence.size }}
        {{- if .Values.objectCache.persistence.storageClassName }}
        storageClassName: {{ .Values.objectCache.persistence.storageClassName | quote }}
        {{- end }}
  {{- end }}
{{- end }}
