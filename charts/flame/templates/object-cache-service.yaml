# Initial cache operations enter through this Service. It selects the
# executor-manager pods, where the cache container listens on the host network.
# Object references then carry that node's IP, so later reads reach the worker
# that holds the data.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "flame.objectCache.name" . }}
  labels:
    {{- include "flame.labels" . | nindent 4 }}
    app.kubernetes.io/component: object-cache
spec:
  type: {{ .Values.objectCache.service.type }}
  ports:
    - name: grpc
      port: {{ .Values.objectCache.service.port }}
      targetPort: grpc
      protocol: TCP
      appProtocol: kubernetes.io/h2c
  selector:
    {{- include "flame.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: executor-manager
