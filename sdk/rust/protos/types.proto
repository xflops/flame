syntax = "proto3";

package flame.v1;

option go_package = "github.com/flame-sh/flame/sdk/go/rpc/v1";

message Metadata {
  string id = 1;
  string name = 2;
}

// Optional list paging. Omitting this message preserves legacy full-list behavior.
message PageRequest {
  // 0 selects 100; valid explicit sizes are 1..1000.
  int32 page_size = 1;
  // One-based page number; 0 selects the first page. Negative values are invalid.
  int64 page_number = 2;
  // Immutable sort field with optional "asc" or "desc". See the API guide.
  string order_by = 4;
}

// Counts apply before page selection. Resource counts ignore table filters.
message PageInfo {
  int64 page_number = 1;
  uint64 total_count = 2;
  uint64 resource_count = 3;
  // State names match the corresponding protobuf enum names.
  map<string, uint64> state_counts = 4;
  // Resource-specific aggregates: session running_tasks; node cpu/memory/gpu.
  map<string, uint64> totals = 5;
  int32 page_size = 6;
  uint64 total_pages = 7;
}

enum SessionState {
  Open = 0;
  Closed = 1;
  Suspending = 2;
  Suspended = 3;
}

message SessionStatus {
  SessionState state = 1;

  int64 creation_time = 2;
  optional int64 completion_time = 3;

  int32 pending = 4;
  int32 running = 5;
  int32 succeed = 6;
  int32 failed = 7;
  int32 cancelled = 9;

  repeated Event events = 8;
}

message SessionSpec {
  string application = 2;
  // Field number 3 (slots) reserved — removed in slots-cleanup refactor; do not reuse.
  reserved 3;
  reserved "slots";
  optional bytes common_data = 4;
  uint32 min_instances = 5;  // Minimum number of instances (default: 0)
  optional uint32 max_instances = 6;  // Maximum number of instances (null means unlimited)
  uint32 batch_size = 7;  // Gang size: bind the session only once it holds this many executors (0 is treated as 1)
  uint32 priority = 8;  // Session priority (default: 0 = lowest)
  optional ResourceRequirement resreq = 9;  // Explicit resource request; if absent, server applies cluster default
  map<string, string> tokens = 10;  // Session-scoped service credentials.
}

message Session {
  Metadata metadata = 1;
  SessionSpec spec = 2;
  SessionStatus status = 3;
}

enum TaskState {
  Pending = 0;
  Running = 1;
  Succeed = 2;
  Failed = 3;
  Cancelled = 4;
}

message TaskStatus {
  TaskState state = 1;

  int64 creation_time = 2;
  optional int64 completion_time = 3;
  repeated Event events = 4;
}

message TaskSpec {
  string session_id = 2;

  optional bytes input = 3;
  optional bytes output = 4;
  repeated bytes affinity = 5;
}

// Volatile, executor-local data advertised by a service for affinity routing.
// An update adds `publish` keys to, and removes `retract` keys from, the
// executor's retained attribute set. A key must not appear in both lists.
message ExecutorAttributes {
  repeated bytes publish = 1;
  repeated bytes retract = 2;
}

message Task {
  Metadata metadata = 1;
  TaskSpec spec = 2;
  TaskStatus status = 3;
}

enum Shim {
  Host = 0;
  Wasm = 1;
  // Value 2 is intentionally left available for RFE522 Sidecar.
  Cri = 3;
}

enum ApplicationState {
  Enabled = 0;
  Disabled = 1;
}

message ApplicationStatus {
  ApplicationState state = 1;

  int64 creation_time = 2;
}

message Environment {
  string name = 1;
  string value = 2;
}

message ApplicationSchema {
  optional string input = 1;
  optional string output = 2;
  optional string common_data = 3;
}

message ApplicationSpec {
  Shim shim = 1;  // Required shim type, defaults to Host
  optional string description = 2;
  repeated string labels = 3;
  optional string image = 4;
  optional string command = 5;
  repeated string arguments = 6;
  repeated Environment environments = 7;
  optional string working_directory = 8;
  optional uint32 max_instances = 9;
  optional int64 delay_release = 10;
  optional ApplicationSchema schema = 11;
  optional string url = 12;
  optional string installer = 13;
}

message Application {
  Metadata metadata = 1;
  ApplicationSpec spec = 2;
  ApplicationStatus status = 3;
}

message ExecutorSpec {
  string node = 1;
  ResourceRequirement resreq = 2;
  // Field number 3 (slots) reserved — removed in slots-cleanup refactor; do not reuse.
  reserved 3;
  reserved "slots";
  Shim shim = 4;  // Supported shim type reported by executor
  string application = 5;
}

/* 
 * void --> idle --> releasing --> released
 *          ↑  |
 *          |  binding
 *  unbinding  |
 *          |  ↓
 *          bound 
 */

enum ExecutorState {
  ExecutorUnknown = 0;
  ExecutorVoid = 1;
  ExecutorIdle = 2;
  ExecutorBinding = 3;
  ExecutorBound = 4;
  ExecutorUnbinding = 5;
  ExecutorReleasing = 6;
  ExecutorReleased = 7;
}

message ExecutorStatus {
  ExecutorState state = 1;
  optional string session_id = 2;
}

message Executor {
  Metadata metadata = 1;
  ExecutorSpec spec = 2;
  ExecutorStatus status = 3;
}

message ExecutorList {
  repeated Executor executors = 1;
  PageInfo paging = 2;
}

message SessionList {
  repeated Session sessions = 1;
  PageInfo paging = 2;
}

message ApplicationList {
  repeated Application applications = 1;
  PageInfo paging = 2;
}

message ResourceRequirement {
  uint64 cpu = 1;
  uint64 memory = 2;
  int32 gpu = 3;
}

// NodeSpec contains the static/desired attributes of a node.
message NodeSpec {
  string hostname = 1;
  repeated Shim shims = 2;  // Shims the node's executor manager runs
}

enum NodeState {
  Unknown = 0;
  Ready = 1;
  NotReady = 2;
}

// NodeInfo contains system information about the node.
message NodeInfo {
  string arch = 1;
  string os = 2;
  string kernel_version = 3;
  string os_image = 4;
  repeated NodeNetworkInterface network_interfaces = 5;
  repeated NodePciDevice pci_devices = 6;
}

// Network inventory visible to the node's executor manager.
message NodeNetworkInterface {
  string name = 1;
  uint32 index = 2;
  string mac_address = 3;
  repeated string addresses = 4; // IPv4/IPv6 addresses with CIDR prefixes when available.
  uint32 mtu = 5; // Zero when unavailable.
  string state = 6;
  string pci_address = 7; // Empty for virtual/non-PCI interfaces.
}

// PCI identifiers are hexadecimal without a 0x prefix; no external ID database is required.
message NodePciDevice {
  string address = 1; // Domain:bus:device.function.
  string vendor_id = 2;
  string device_id = 3;
  string class_id = 4;
  string driver = 5;
  optional int32 numa_node = 6; // Absent when unknown or not applicable.
}

// NodeAddress represents a network address for a node.
message NodeAddress {
  string type = 1;    // e.g., "InternalIP", "ExternalIP", "Hostname"
  string address = 2;
}

// NodeStatus contains the dynamic/observed state of a node.
message NodeStatus {
  NodeState state = 1;
  ResourceRequirement capacity = 2;
  ResourceRequirement allocatable = 3;
  NodeInfo info = 4;
  repeated NodeAddress addresses = 5;
  int64 last_heartbeat_time = 6;  // Unix epoch seconds
}

// Node follows the standard Kubernetes-style object pattern.
message Node {
  Metadata metadata = 1;
  NodeSpec spec = 2;
  NodeStatus status = 3;
}

// NodeList contains a list of nodes.
message NodeList {
  repeated Node nodes = 1;
  PageInfo paging = 2;
}

message Result {
  int32 return_code = 1;
  optional string message = 2;
}

message TaskResult {
  int32 return_code = 1;
  optional bytes output = 2;
  optional string message = 3;
}

message EmptyRequest {
}

message Event {
  int32 code = 1;
  optional string message = 2;
  int64 creation_time = 3;  // Unix timestamp in milliseconds
}
