syntax = "proto3";

package flame.v1;

option go_package = "github.com/flame-sh/flame/sdk/go/rpc/v1";

// The cache stores opaque bytes. Clients serialize and deserialize values,
// including Arrow values, before sending them over this service.
service ObjectCacheService {
  // Add one part, creating the object if missing; a namespace key generates an object ID.
  rpc Put(stream CacheWriteRequest) returns (CacheObjectMetadata) {}
  // Add one part to a full object key, creating the object if missing.
  rpc Patch(stream CacheWriteRequest) returns (CacheObjectMetadata) {}
  rpc Get(CacheGetRequest) returns (stream CacheGetResponse) {}
}

message CacheWriteHeader {
  // A full app/session/object key, or an app/session prefix for PUT.
  string key = 1;
  // Client-defined payload type (for example, "raw.zstd"). The cache stores
  // this without interpreting its encoding or compression.
  string data_type = 2;
  // Exact number of encoded payload bytes in this PUT or PATCH, zero for empty.
  uint64 size = 3;
}

message CacheWriteRequest {
  // Exactly one header must precede zero or more data chunks. Each data chunk
  // should be at most 1 MiB to stay below the default gRPC message limit.
  // A header without data chunks stores an empty payload.
  oneof payload {
    CacheWriteHeader header = 1;
    bytes data = 2;
  }
}

message CacheObjectMetadata {
  // The endpoint identifies the replica that owns this object.
  string endpoint = 1;
  string key = 2;
  uint64 version = 3;
  uint64 size = 4;
  // Unix timestamp in milliseconds, retained for cache lifecycle accounting.
  int64 creation_time = 6;
  // Client-defined type shared by all the data parts of the object.
  string data_type = 7;
  // Identity of this object; unchanged by append and new on key recreation.
  string uuid = 8;
}

enum CacheGetMode {
  OBJECT = 0;
  METADATA = 1;
  PATCHES = 2;
}

message CacheGetRequest {
  string key = 1;
  // Part count: OBJECT returns [0, version), PATCHES returns [version, current).
  // OBJECT with zero selects the latest complete object. METADATA ignores it.
  uint64 version = 2;
  // Expected object UUID; required for PATCHES with a nonzero cursor.
  string uuid = 3;
  CacheGetMode mode = 4;
}

message CacheGetHeader {
  // OBJECT prefix reads describe that prefix; other modes describe current state.
  CacheObjectMetadata metadata = 1;
}

message CacheGetChunk {
  // Zero-based owning part. Chunks for a part are contiguous; empty parts emit
  // one empty chunk. Only objects have versions (their committed part count).
  uint64 part = 1;
  bytes data = 2;
}

message CacheGetResponse {
  // The first message is always a header. It is followed by the chunks of the
  // data parts, none if the client already has the current version.
  oneof payload {
    CacheGetHeader header = 1;
    CacheGetChunk chunk = 2;
  }
}
