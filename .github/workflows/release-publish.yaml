name: Flame Release Publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to publish or recover
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: flame-release-publish-${{ github.event.release.tag_name || inputs.release_tag }}
  cancel-in-progress: false

env:
  CLICOLOR_FORCE: 1
  IMAGE_REGISTRY: docker.io/xflops
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}

jobs:
  release-metadata:
    name: Release Metadata
    runs-on: ubuntu-latest
    outputs:
      cargo-version: ${{ steps.metadata.outputs.cargo-version }}
      docker-tag: ${{ steps.metadata.outputs.docker-tag }}
      python-version: ${{ steps.metadata.outputs.python-version }}
      source-sha: ${{ steps.metadata.outputs.source-sha }}
      stdng-version: ${{ steps.metadata.outputs.stdng-version }}
    steps:
      - name: Checkout release tooling
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}

      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          path: source

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Validate release metadata
        id: metadata
        working-directory: source
        run: ../hack/release.sh validate-metadata "${RELEASE_TAG}" "${GITHUB_OUTPUT}"

  publish-python:
    name: Publish flamepy
    runs-on: ubuntu-latest
    needs: release-metadata
    steps:
      - name: Checkout release tooling
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}

      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-metadata.outputs.source-sha }}
          path: source

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Validate PyPI credentials
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: hack/release.sh validate-credentials pypi

      - name: Build and validate flamepy
        env:
          PYTHON_VERSION: ${{ needs.release-metadata.outputs.python-version }}
        working-directory: source
        run: ../hack/release.sh build-python "${PYTHON_VERSION}"

      - name: Publish flamepy to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: source/dist/flamepy
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true

      - name: Verify flamepy from PyPI
        env:
          PYTHON_VERSION: ${{ needs.release-metadata.outputs.python-version }}
        run: hack/release.sh verify-pypi "${PYTHON_VERSION}"

  publish-rust:
    name: Publish Rust crates
    runs-on: ubuntu-latest
    needs: release-metadata
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      CARGO_VERSION: ${{ needs.release-metadata.outputs.cargo-version }}
      STDNG_VERSION: ${{ needs.release-metadata.outputs.stdng-version }}
    steps:
      - name: Checkout release tooling
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}

      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-metadata.outputs.source-sha }}
          path: source

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler pkg-config libssl-dev

      - name: Validate crates.io credentials
        run: hack/release.sh validate-credentials crates

      - name: Package and publish Rust crates
        working-directory: source
        run: ../hack/release.sh publish-rust "${CARGO_VERSION}" "${STDNG_VERSION}"

  publish-images:
    name: Publish ${{ matrix.image }}
    runs-on: ubuntu-latest
    needs: release-metadata
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: flame-session-manager
            dockerfile: docker/Dockerfile.fsm
          - image: flame-object-cache
            dockerfile: docker/Dockerfile.foc
          - image: flame-executor-manager
            dockerfile: docker/Dockerfile.fem
          - image: flame-console
            dockerfile: docker/Dockerfile.console
          - image: flame-instance-runtime
            dockerfile: docker/Dockerfile.flmrt
    steps:
      - name: Checkout release tooling
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}

      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-metadata.outputs.source-sha }}
          path: source

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Hub credentials
        env:
          DOCKER_HUB_PAT: ${{ secrets.DOCKER_HUB_PAT }}
          DOCKER_HUB_USERNAME: ${{ vars.DOCKER_HUB_USERNAME }}
        run: hack/release.sh validate-credentials docker

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PAT }}

      - name: Collect Docker metadata
        id: docker-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_REGISTRY }}/${{ matrix.image }}
          tags: |
            type=raw,value=${{ needs.release-metadata.outputs.docker-tag }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: source
          file: source/${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.docker-meta.outputs.tags }}
          labels: ${{ steps.docker-meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          provenance: false

      - name: Verify pushed image manifest
        env:
          DOCKER_TAG: ${{ needs.release-metadata.outputs.docker-tag }}
        run: hack/release.sh verify-images "${IMAGE_REGISTRY}/${{ matrix.image }}:${DOCKER_TAG}"
