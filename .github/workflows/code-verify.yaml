name: Flame CI
on: [push, pull_request]
concurrency:
  group: flame-code-verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  CLICOLOR_FORCE: 1
jobs:
  image-publishing:
    name: Image Publishing Verify
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Validate publishing scripts
        run: |
          bash -n ci/release/image-manifests.sh
          python3 -m unittest discover -s ci/release -p test_image_manifests.py -v
      - name: Validate Bake targets
        run: |
          for arch in amd64 arm64; do
            ARCH="$arch" docker buildx bake --file ci/release/image-bake.hcl --print > "bake-${arch}.json"
            jq -e --arg platform "linux/${arch}" '.target | length == 6 and all(.[]; .platforms == [$platform])' "bake-${arch}.json"
          done

  rust:
    name: Rust Code Verify
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt, clippy
      - name: Install gRPC
        run: |
          sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Cargo fmt
        run: cargo fmt --all -- --check
      - name: Cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Cargo test
        run: cargo test --workspace --exclude flame-rs
      - name: Cargo build
        run: cargo build --workspace --exclude flame-rs

  python:
    name: Python Code Verify
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: sdk/python
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: sdk/python/pyproject.toml
      - name: Ruff format
        run: uv run --extra dev ruff format --check src tests
      - name: Ruff lint
        run: uv run --extra dev ruff check src tests
      - name: Python unit tests
        run: uv run --extra dev --with numpy pytest tests
      - name: Python build
        run: uv build
