name: CodeQL

on:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  python:
    name: Analyze Python
    runs-on: ubuntu-26.04
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Analyze
        uses: ./.github/actions/codeql
        with:
          language: python

  rust:
    name: Analyze Rust
    runs-on: ubuntu-26.04
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Analyze
        uses: ./.github/actions/codeql
        with:
          language: rust
