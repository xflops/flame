name: Build Native Images

on:
  workflow_call:
    inputs:
      source-sha:
        required: true
        type: string
      image-tag:
        required: true
        type: string
    secrets:
      DOCKER_HUB_PAT:
        required: true

permissions:
  contents: read

env:
  IMAGE_REGISTRY: docker.io/xflops

jobs:
  build:
    name: Build ${{ matrix.arch }} images
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-26.04
          - arch: arm64
            runner: ubuntu-26.04-arm
    steps:
      - name: Checkout publishing tooling
        uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}

      - name: Checkout image source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source-sha }}
          path: source

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Validate Docker Hub credentials
        env:
          DOCKER_HUB_PAT: ${{ secrets.DOCKER_HUB_PAT }}
          DOCKER_HUB_USERNAME: ${{ vars.DOCKER_HUB_USERNAME }}
        run: hack/release.sh validate-credentials docker

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PAT }}

      - name: Build and push native images
        id: build
        uses: docker/bake-action@v7
        env:
          SOURCE_CONTEXT: source
          SOURCE_SHA: ${{ inputs.source-sha }}
          IMAGE_TAG: ${{ inputs.image-tag }}
          ARCH: ${{ matrix.arch }}
        with:
          source: .
          files: ci/release/image-bake.hcl
          push: true

      # Only the digests are needed. The full build metadata embeds the commit
      # message of the pushed commit once per image, so it can grow past the
      # 128 KiB limit of one environment variable (Argument list too long).
      - name: Save image digests
        env:
          BUILD_DIGESTS: >-
            ${{ format('{{"flame-session-manager":{{"containerimage.digest":"{0}"}},"flame-object-cache":{{"containerimage.digest":"{1}"}},"flame-executor-manager-runtime":{{"containerimage.digest":"{2}"}},"flame-executor-manager-devel":{{"containerimage.digest":"{3}"}},"flame-console":{{"containerimage.digest":"{4}"}},"flame-test":{{"containerimage.digest":"{5}"}},"flame-instance-runtime":{{"containerimage.digest":"{6}"}},"flame-instance-runtime-devel":{{"containerimage.digest":"{7}"}}}}',
            fromJSON(steps.build.outputs.metadata)['flame-session-manager']['containerimage.digest'],
            fromJSON(steps.build.outputs.metadata)['flame-object-cache']['containerimage.digest'],
            fromJSON(steps.build.outputs.metadata)['flame-executor-manager-runtime']['containerimage.digest'],
            fromJSON(steps.build.outputs.metadata)['flame-executor-manager-devel']['containerimage.digest'],
            fromJSON(steps.build.outputs.metadata)['flame-console']['containerimage.digest'],
            fromJSON(steps.build.outputs.metadata)['flame-test']['containerimage.digest'],
            fromJSON(steps.build.outputs.metadata)['flame-instance-runtime']['containerimage.digest'],
            fromJSON(steps.build.outputs.metadata)['flame-instance-runtime-devel']['containerimage.digest']) }}
          ARCH: ${{ matrix.arch }}
        run: printf '%s\n' "$BUILD_DIGESTS" > "${RUNNER_TEMP}/digests-${ARCH}.json"

      - name: Smoke test native images
        env:
          ARCH: ${{ matrix.arch }}
        run: bash ci/release/image-manifests.sh check "${IMAGE_REGISTRY}" "${ARCH}" "${RUNNER_TEMP}/digests-${ARCH}.json"

      - name: Upload verified digests
        uses: actions/upload-artifact@v7
        with:
          name: image-digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests-${{ matrix.arch }}.json
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  merge:
    name: Merge and verify image manifests
    runs-on: ubuntu-26.04
    needs: build
    steps:
      - name: Checkout publishing tooling
        uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PAT }}

      - name: Download verified digests
        uses: actions/download-artifact@v8
        with:
          pattern: image-digests-*
          path: digests
          merge-multiple: true

      - name: Publish multiarchitecture manifests
        env:
          IMAGE_TAG: ${{ inputs.image-tag }}
        run: bash ci/release/image-manifests.sh merge "${IMAGE_REGISTRY}" "${IMAGE_TAG}" digests
