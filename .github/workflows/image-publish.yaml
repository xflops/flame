name: Publish Latest Images

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-publish-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_REGISTRY: docker.io/xflops

jobs:
  publish:
    name: Publish ${{ matrix.image }}
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: flame-session-manager
            dockerfile: docker/Dockerfile.fsm
          - image: flame-object-cache
            dockerfile: docker/Dockerfile.foc
          - image: flame-executor-manager
            dockerfile: docker/Dockerfile.fem
          - image: flame-console
            dockerfile: docker/Dockerfile.console
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Hub credentials
        env:
          DOCKER_HUB_PAT: ${{ secrets.DOCKER_HUB_PAT }}
          DOCKER_HUB_USERNAME: ${{ vars.DOCKER_HUB_USERNAME }}
        run: hack/release.sh validate-credentials docker

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PAT }}

      - name: Collect Docker metadata
        id: docker-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_REGISTRY }}/${{ matrix.image }}
          tags: |
            type=raw,value=sha-${{ github.sha }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          pull: true
          push: true
          tags: ${{ steps.docker-meta.outputs.tags }}
          labels: ${{ steps.docker-meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          provenance: false

      - name: Verify pushed manifests
        env:
          IMAGE: ${{ env.IMAGE_REGISTRY }}/${{ matrix.image }}
        run: hack/release.sh verify-images "${IMAGE}:sha-${GITHUB_SHA}"

  promote:
    name: Promote images to latest
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: publish
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Hub credentials
        env:
          DOCKER_HUB_PAT: ${{ secrets.DOCKER_HUB_PAT }}
          DOCKER_HUB_USERNAME: ${{ vars.DOCKER_HUB_USERNAME }}
        run: hack/release.sh validate-credentials docker

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PAT }}

      - name: Promote verified manifests
        run: hack/release.sh promote-images "${IMAGE_REGISTRY}" "${GITHUB_SHA}"
