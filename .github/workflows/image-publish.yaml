name: Publish Latest Images

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-publish-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_REGISTRY: docker.io/xflops

jobs:
  publish:
    name: Publish native images
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/build-images.yaml
    with:
      source-sha: ${{ github.sha }}
      image-tag: sha-${{ github.sha }}
    secrets: inherit

  promote:
    name: Promote images to latest
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: publish
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Hub credentials
        env:
          DOCKER_HUB_PAT: ${{ secrets.DOCKER_HUB_PAT }}
          DOCKER_HUB_USERNAME: ${{ vars.DOCKER_HUB_USERNAME }}
        run: hack/release.sh validate-credentials docker

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PAT }}

      - name: Promote verified manifests
        run: hack/release.sh promote-images "${IMAGE_REGISTRY}" "${GITHUB_SHA}"
