name: Publish Latest Images

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-publish-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_REGISTRY: docker.io/xflops

jobs:
  publish:
    name: Publish native images
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/build-images.yaml
    with:
      source-sha: ${{ github.sha }}
      image-tag: sha-${{ github.sha }}
    secrets: inherit

  promote:
    name: Promote images to latest
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    needs: publish
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check main has not moved on
        id: head
        run: |
          current="$(bash ci/release/publication.sh main "${GITHUB_SHA}")"
          echo "current=${current}" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        if: steps.head.outputs.current == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Validate Docker Hub credentials
        if: steps.head.outputs.current == 'true'
        env:
          DOCKER_HUB_PAT: ${{ secrets.DOCKER_HUB_PAT }}
          DOCKER_HUB_USERNAME: ${{ vars.DOCKER_HUB_USERNAME }}
        run: hack/release.sh validate-credentials docker

      - name: Login to Docker Hub
        if: steps.head.outputs.current == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PAT }}

      - name: Promote verified manifests
        if: steps.head.outputs.current == 'true'
        run: hack/release.sh promote-images "${IMAGE_REGISTRY}" "${GITHUB_SHA}"
