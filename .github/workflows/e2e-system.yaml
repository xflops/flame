name: Flame CI
on: [push, pull_request]
env:
  CLICOLOR_FORCE: 1
jobs:
  ci:
    name: Python System Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: Set up Docker Compose
        uses: docker/setup-compose-action@v1
        with:
          version: latest

      - name: Generate TLS certificates
        run: |
          chmod +x ci/docker/generate-certs.sh
          ci/docker/generate-certs.sh -o ci/docker/certs -s "flame-session-manager,flame-executor-manager,flame-object-cache,localhost,127.0.0.1" -i "172.20.0.0/24"

      - name: Start Flame
        run: |
          cp ci/docker/flame-cluster-e2e.yaml ci/docker/flame-cluster.yaml
          docker compose up --build --force-recreate -d

      - name: Wait for services to be ready
        run: |
          echo "Waiting for services to be ready..."
          sleep 10
          docker compose ps

      - name: Run Python system tests
        timeout-minutes: 120
        run: |
          make e2e-py-system-docker

      - name: Print session-manager logs
        if: always()
        run: |
          echo "=== Session Manager Logs ==="
          docker compose logs flame-session-manager --tail=500

      - name: Print executor-manager logs
        if: always()
        run: |
          echo "=== Executor Manager Logs ==="
          docker compose logs flame-executor-manager --tail=500

      - name: Print object-cache logs
        if: always()
        run: |
          echo "=== Object Cache Logs ==="
          docker compose logs flame-object-cache --tail=500
