name: Flame CI

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

concurrency:
  group: flame-k8s-e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  CLICOLOR_FORCE: 1
  DOCKER_BUILDKIT: 1
  IMAGE_REGISTRY: xflops
  IMAGE_TAG: ci
  AUTO_DIAGNOSTICS: "false"

jobs:
  ci:
    name: Kubernetes E2E Test
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create Kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: flame
          config: ci/k8s/kind.yaml
          wait: 120s

      - name: Build Flame images
        run: docker buildx bake --file ci/k8s/docker-bake.hcl --load

      - name: Load images into Kind
        run: |
          kind load docker-image ${IMAGE_REGISTRY}/flame-session-manager:${IMAGE_TAG} --name flame
          kind load docker-image ${IMAGE_REGISTRY}/flame-object-cache:${IMAGE_TAG} --name flame
          kind load docker-image ${IMAGE_REGISTRY}/flame-executor-manager:${IMAGE_TAG} --name flame

      - name: Install cert-manager and Envoy Gateway
        run: ci/k8s/e2e.sh install-infrastructure

      - name: Install Flame
        run: ci/k8s/e2e.sh install-flame

      - name: Configure external access
        run: ci/k8s/e2e.sh configure-access

      - name: Run smoke tests from VM
        run: ci/k8s/e2e.sh run-smoke-tests

      - name: Run E2E tests from VM
        timeout-minutes: 20
        run: ci/k8s/e2e.sh run-e2e-tests

      - name: Print Kubernetes diagnostics
        if: failure() || cancelled()
        run: ci/k8s/e2e.sh diagnostics
